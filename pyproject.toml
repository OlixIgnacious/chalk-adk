[project]
name = "chalk-adk"
version = "0.1.0"
description = "Source-grounded interactive lessons generator using Google ADK and Gemini"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=1.0.0",
    "litellm>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "kokoro-onnx>=0.3.0",
    "soundfile>=0.12.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

